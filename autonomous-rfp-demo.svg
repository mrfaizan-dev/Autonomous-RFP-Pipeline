<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">Watch the Autonomous RFP Pipeline Demo</title>
  <desc id="desc">A vibrant banner inviting visitors to watch the AI-powered Autonomous RFP Pipeline demo on YouTube, with a large red play button.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1030"/>
      <stop offset="0.55" stop-color="#0E0B2B"/>
      <stop offset="1" stop-color="#150A29"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F43F5E" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#C7F3FF"/>
      <stop offset="1" stop-color="#E0C8FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F43F5E" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2250"/>
      <stop offset="1" stop-color="#2A1450"/>
    </linearGradient>
    <linearGradient id="ytRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF3B30"/>
      <stop offset="1" stop-color="#D90F0F"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.18"/>
    </linearGradient>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#FF2A1F" flood-opacity="0.55"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <clipPath id="clipBanner"><rect width="1200" height="320" rx="24"/></clipPath>
    <clipPath id="clipThumb"><rect x="800" y="44" width="340" height="190" rx="14"/></clipPath>

    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
      .pulse2 { animation-delay: 1.2s; }
      @keyframes pulse {
        0%   { transform: scale(1);    opacity: 0.55; }
        100% { transform: scale(1.55); opacity: 0; }
      }
      .dot { animation: blink 1.4s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
      .flow { stroke-dasharray: 5 6; animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -11; } }
    </style>
  </defs>

  <!-- Background -->
  <g clip-path="url(#clipBanner)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <ellipse cx="170" cy="40" rx="280" ry="170" fill="url(#glowCyan)"/>
    <ellipse cx="640" cy="330" rx="340" ry="150" fill="url(#glowViolet)"/>
    <ellipse cx="1010" cy="140" rx="300" ry="200" fill="url(#glowPink)"/>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Accent bar -->
  <rect x="44" y="48" width="5" height="224" rx="2.5" fill="url(#accent)"/>

  <!-- Live badge -->
  <g transform="translate(70 46)">
    <rect width="262" height="30" rx="15" fill="#F43F5E" fill-opacity="0.14" stroke="#F43F5E" stroke-opacity="0.55"/>
    <circle class="dot" cx="19" cy="15" r="5" fill="#FF4D5E"/>
    <text class="t" x="34" y="20" fill="#FFB3BC" font-size="13" font-weight="700" letter-spacing="2.2">LIVE PROJECT WALKTHROUGH</text>
  </g>

  <!-- Title -->
  <text class="t" x="68" y="132" fill="url(#titleGrad)" font-size="46" font-weight="800" letter-spacing="0.5">AUTONOMOUS</text>
  <text class="t" x="68" y="182" fill="url(#titleGrad)" font-size="46" font-weight="800" letter-spacing="0.5">RFP PIPELINE</text>
  <rect x="70" y="196" width="120" height="4" rx="2" fill="url(#accent)" transform="rotate(-90 70 196) rotate(90 70 196)"/>

  <!-- Subtitle -->
  <text class="t" x="70" y="226" fill="#C4CFE6" font-size="19">From public RFP to evidence-grounded proposal.</text>

  <!-- Pipeline chips -->
  <g class="t" font-size="13" font-weight="700" letter-spacing="0.6">
    <g transform="translate(70 246)">
      <rect width="92" height="30" rx="15" fill="url(#chip)" stroke="#22D3EE" stroke-opacity="0.6"/>
      <text x="46" y="20" text-anchor="middle" fill="#8CEBFA">Scraping</text>
    </g>
    <line class="flow" x1="166" y1="261" x2="186" y2="261" stroke="#7C8BB5" stroke-width="2" stroke-linecap="round"/>
    <g transform="translate(190 246)">
      <rect width="112" height="30" rx="15" fill="url(#chip)" stroke="#8B5CF6" stroke-opacity="0.7"/>
      <text x="56" y="20" text-anchor="middle" fill="#CDB8FF">Portfolio RAG</text>
    </g>
    <line class="flow" x1="306" y1="261" x2="326" y2="261" stroke="#7C8BB5" stroke-width="2" stroke-linecap="round"/>
    <g transform="translate(330 246)">
      <rect width="92" height="30" rx="15" fill="url(#chip)" stroke="#EC4899" stroke-opacity="0.65"/>
      <text x="46" y="20" text-anchor="middle" fill="#FFB8DD">AI Critic</text>
    </g>
    <line class="flow" x1="426" y1="261" x2="446" y2="261" stroke="#7C8BB5" stroke-width="2" stroke-linecap="round"/>
    <g transform="translate(450 246)">
      <rect width="118" height="30" rx="15" fill="url(#chip)" stroke="#34D399" stroke-opacity="0.65"/>
      <text x="59" y="20" text-anchor="middle" fill="#9AF0CC">Human Review</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="740" y1="56" x2="740" y2="264" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Video player card -->
  <g filter="url(#cardShadow)">
    <rect x="788" y="32" width="364" height="256" rx="20" fill="#0A0E24" stroke="url(#borderGrad)" stroke-width="1.5"/>
  </g>

  <!-- Thumbnail -->
  <rect x="800" y="44" width="340" height="190" rx="14" fill="url(#card)"/>
  <g clip-path="url(#clipThumb)">
    <rect x="800" y="44" width="340" height="190" fill="url(#grid)"/>
    <ellipse cx="970" cy="139" rx="150" ry="95" fill="url(#glowPink)"/>
    <!-- faux window dots -->
    <circle cx="820" cy="62" r="4" fill="#FF5F57"/>
    <circle cx="834" cy="62" r="4" fill="#FEBC2E"/>
    <circle cx="848" cy="62" r="4" fill="#28C840"/>
    <!-- faux UI blocks -->
    <rect x="818" y="82" width="86" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.16"/>
    <rect x="818" y="98" width="58" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.09"/>
    <rect x="818" y="196" width="70" height="20" rx="6" fill="#22D3EE" fill-opacity="0.22"/>
    <rect x="1040" y="82" width="82" height="52" rx="8" fill="#8B5CF6" fill-opacity="0.22"/>
    <rect x="1040" y="144" width="82" height="34" rx="8" fill="#22D3EE" fill-opacity="0.16"/>
    <rect x="1052" y="196" width="70" height="20" rx="6" fill="#34D399" fill-opacity="0.22"/>
    <rect x="800" y="44" width="340" height="190" fill="#05061A" fill-opacity="0.28"/>
  </g>

  <!-- Play button glow + pulse rings -->
  <ellipse cx="970" cy="139" rx="92" ry="64" fill="#FF2A1F" fill-opacity="0.55" filter="url(#blur)"/>
  <rect class="pulse" x="900" y="99" width="140" height="80" rx="24" fill="none" stroke="#FF4D42" stroke-width="3"/>
  <rect class="pulse pulse2" x="900" y="99" width="140" height="80" rx="24" fill="none" stroke="#FF4D42" stroke-width="3"/>

  <!-- YouTube play button -->
  <g filter="url(#shadow)">
    <rect x="900" y="99" width="140" height="80" rx="24" fill="url(#ytRed)"/>
    <rect x="901" y="100" width="138" height="78" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5"/>
    <path d="M957 118 L957 160 Q957 164 961 162 L997 142 Q1001 139 997 136 L961 116 Q957 114 957 118 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Progress bar -->
  <rect x="818" y="224" width="304" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.18"/>
  <rect x="818" y="224" width="118" height="4" rx="2" fill="#FF3B30"/>
  <circle cx="936" cy="226" r="6" fill="#FF3B30"/>

  <!-- CTA label -->
  <g transform="translate(970 266)">
    <text class="t" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="800" letter-spacing="1.6">▶  WATCH THE DEMO ON YOUTUBE</text>
  </g>

  <!-- HD badge -->
  <g transform="translate(1086 52)">
    <rect width="44" height="22" rx="6" fill="#000000" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text class="t" x="22" y="16" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800" letter-spacing="1">HD</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
