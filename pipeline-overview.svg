<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="pipe-title pipe-desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="pipe-title">Autonomous RFP Pipeline: six stages</title>
  <desc id="pipe-desc">Six stages in order: scrape the RFP page, analyze requirements, retrieve portfolio evidence, write the proposal, critique it, and review it by a human. A dashed loop shows that the critic can send the draft back to the writer for up to three writer passes.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#A9C0AE"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#E0A33A"/>
    </marker>
  </defs>

  <rect width="1200" height="230" rx="18" fill="#1B211E"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <!-- Card 1: Scrape -->
    <rect x="20" y="34" width="170" height="112" rx="12" fill="#25302A" stroke="#3E5A4A" stroke-width="1.5"/>
    <circle cx="46" cy="62" r="14" fill="#2F6B4F"/>
    <text x="46" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F2EA">1</text>
    <text x="70" y="68" font-size="20" font-weight="700" fill="#F5F2EA">Scrape</text>
    <text x="38" y="102" font-size="14" fill="#C9D8CC">Extract page text</text>
    <text x="38" y="124" font-size="14" fill="#C9D8CC">from the RFP URL</text>

    <!-- Card 2: Analyze -->
    <rect x="218" y="34" width="170" height="112" rx="12" fill="#25302A" stroke="#3E5A4A" stroke-width="1.5"/>
    <circle cx="244" cy="62" r="14" fill="#2F6B4F"/>
    <text x="244" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F2EA">2</text>
    <text x="268" y="68" font-size="20" font-weight="700" fill="#F5F2EA">Analyze</text>
    <text x="236" y="102" font-size="14" fill="#C9D8CC">Find requirements,</text>
    <text x="236" y="124" font-size="14" fill="#C9D8CC">gaps and limits</text>

    <!-- Card 3: Retrieve -->
    <rect x="416" y="34" width="170" height="112" rx="12" fill="#25302A" stroke="#3E5A4A" stroke-width="1.5"/>
    <circle cx="442" cy="62" r="14" fill="#2F6B4F"/>
    <text x="442" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F2EA">3</text>
    <text x="466" y="68" font-size="20" font-weight="700" fill="#F5F2EA">Retrieve</text>
    <text x="434" y="102" font-size="14" fill="#C9D8CC">Pull matching</text>
    <text x="434" y="124" font-size="14" fill="#C9D8CC">portfolio evidence</text>

    <!-- Card 4: Write -->
    <rect x="614" y="34" width="170" height="112" rx="12" fill="#25302A" stroke="#3E5A4A" stroke-width="1.5"/>
    <circle cx="640" cy="62" r="14" fill="#2F6B4F"/>
    <text x="640" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F2EA">4</text>
    <text x="664" y="68" font-size="20" font-weight="700" fill="#F5F2EA">Write</text>
    <text x="632" y="102" font-size="14" fill="#C9D8CC">Draft a proposal</text>
    <text x="632" y="124" font-size="14" fill="#C9D8CC">for the client</text>

    <!-- Card 5: Critique -->
    <rect x="812" y="34" width="170" height="112" rx="12" fill="#25302A" stroke="#3E5A4A" stroke-width="1.5"/>
    <circle cx="838" cy="62" r="14" fill="#2F6B4F"/>
    <text x="838" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F2EA">5</text>
    <text x="862" y="68" font-size="20" font-weight="700" fill="#F5F2EA">Critique</text>
    <text x="830" y="102" font-size="14" fill="#C9D8CC">Independent</text>
    <text x="830" y="124" font-size="14" fill="#C9D8CC">quality check</text>

    <!-- Card 6: Human review -->
    <rect x="1010" y="34" width="170" height="112" rx="12" fill="#25302A" stroke="#E0A33A" stroke-width="2"/>
    <circle cx="1036" cy="62" r="14" fill="#E0A33A"/>
    <text x="1036" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#1B211E">6</text>
    <text x="1060" y="68" font-size="20" font-weight="700" fill="#F5F2EA">Review</text>
    <text x="1028" y="102" font-size="14" fill="#C9D8CC">Human approves</text>
    <text x="1028" y="124" font-size="14" fill="#C9D8CC">or requests edits</text>
  </g>

  <!-- Arrows between cards -->
  <g stroke="#A9C0AE" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M192 90 H214"/>
    <path d="M390 90 H412"/>
    <path d="M588 90 H610"/>
    <path d="M786 90 H808"/>
    <path d="M984 90 H1006"/>
  </g>

  <!-- Revision loop: critic back to writer -->
  <path d="M897 148 V182 H699 V152" fill="none" stroke="#E0A33A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-amber)"/>
  <text x="798" y="208" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#E0A33A">Critic can send the draft back to the writer (up to 3 writer passes)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
