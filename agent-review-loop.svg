<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="t d">
<title id="t">Human-controlled proposal review</title><desc id="d">The proposal writer sends a draft to an independent critic. The critic may request a writer revision, then the human reviewer approves or requests feedback.</desc>
<rect width="1000" height="190" rx="20" fill="#F4F7F4" stroke="#D7E4DC"/>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle">
<g transform="translate(48 38)"><rect width="220" height="100" rx="15" fill="#174B40"/><text x="110" y="42" fill="#FFFFFF" font-size="18" font-weight="800">PROPOSAL WRITER</text><text x="110" y="67" fill="#CBEBDD" font-size="12">Creates an evidence-led draft</text></g>
<path d="M272 88h75m-9-8 9 8-9 8" stroke="#609681" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(352 38)"><rect width="220" height="100" rx="15" fill="#3C456F"/><text x="110" y="42" fill="#FFFFFF" font-size="18" font-weight="800">INDEPENDENT CRITIC</text><text x="110" y="67" fill="#E1E5F5" font-size="12">Checks gaps and unsupported claims</text></g>
<path d="M576 88h75m-9-8 9 8-9 8" stroke="#B78432" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(656 38)"><rect width="294" height="100" rx="15" fill="#F4D58D"/><text x="147" y="42" fill="#38280A" font-size="18" font-weight="800">HUMAN REVIEW</text><text x="147" y="67" fill="#614817" font-size="12">Edit · request revision · approve</text></g>
<path d="M462 144v22H158v-23" stroke="#C28A2E" stroke-width="2.2" fill="none" stroke-dasharray="6 5"/><text x="310" y="181" fill="#78561E" font-size="11" font-weight="700">REVISION NEEDED · UP TO 3 WRITER PASSES</text>
</g></svg>