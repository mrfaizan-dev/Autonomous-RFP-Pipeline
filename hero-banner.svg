<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="hero-title hero-desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="hero-title">Autonomous RFP Pipeline</title>
  <desc id="hero-desc">Banner for the Autonomous RFP Pipeline project. A web page with project requirements flows into a proposal document that has been checked and approved. The banner lists FastAPI, LangGraph, Celery, Redis, ChromaDB and Next.js.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B211E"/>
      <stop offset="0.55" stop-color="#1F3D2E"/>
      <stop offset="1" stop-color="#245B43"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#3FB584" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3FB584" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#A9C0AE" fill-opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="300" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <circle cx="1130" cy="40" r="150" fill="none" stroke="#A9C0AE" stroke-opacity="0.10" stroke-width="1.5"/>
    <circle cx="1130" cy="40" r="220" fill="none" stroke="#A9C0AE" stroke-opacity="0.07" stroke-width="1.5"/>

    <!-- Title block -->
    <text x="60" y="108" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#F5F2EA" textLength="680" lengthAdjust="spacingAndGlyphs">Autonomous RFP Pipeline</text>
    <text x="60" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#C9D8CC">Submit an RFP URL and get an evidence-grounded proposal,</text>
    <text x="60" y="178" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#C9D8CC">checked by an AI critic and approved by a human.</text>

    <!-- Technology chips -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#E7EFE9" text-anchor="middle">
      <rect x="60"  y="208" width="92"  height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#A9C0AE" stroke-opacity="0.40"/>
      <text x="106" y="230">FastAPI</text>
      <rect x="162" y="208" width="108" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#A9C0AE" stroke-opacity="0.40"/>
      <text x="216" y="230">LangGraph</text>
      <rect x="280" y="208" width="88"  height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#A9C0AE" stroke-opacity="0.40"/>
      <text x="324" y="230">Celery</text>
      <rect x="378" y="208" width="80"  height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#A9C0AE" stroke-opacity="0.40"/>
      <text x="418" y="230">Redis</text>
      <rect x="468" y="208" width="108" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#A9C0AE" stroke-opacity="0.40"/>
      <text x="522" y="230">ChromaDB</text>
      <rect x="586" y="208" width="92"  height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#A9C0AE" stroke-opacity="0.40"/>
      <text x="632" y="230">Next.js</text>
    </g>

    <!-- Illustration: requirements flowing into a reviewed proposal -->
    <g stroke="#A9C0AE" stroke-opacity="0.55" stroke-width="1.6" stroke-dasharray="5 5" fill="none">
      <path d="M812 84 C 850 84, 862 110, 900 112"/>
      <path d="M782 150 L 900 150"/>
      <path d="M812 216 C 850 216, 862 190, 900 188"/>
    </g>
    <g fill="#2F6B4F" stroke="#A9C0AE" stroke-width="2">
      <circle cx="804" cy="84" r="10"/>
      <circle cx="774" cy="150" r="12"/>
      <circle cx="804" cy="216" r="10"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="900" y="48" width="200" height="204" rx="14" fill="#F5F2EA"/>
    </g>
    <rect x="920" y="68" width="74" height="10" rx="5" fill="#1F4D3A"/>
    <rect x="1046" y="66" width="34" height="14" rx="7" fill="#E0A33A"/>
    <rect x="920" y="96"  width="160" height="7" rx="3.5" fill="#C9D8CC"/>
    <rect x="920" y="112" width="128" height="7" rx="3.5" fill="#C9D8CC"/>
    <rect x="920" y="128" width="148" height="7" rx="3.5" fill="#C9D8CC"/>

    <g>
      <circle cx="927" cy="160" r="7" fill="#3FB584"/>
      <path d="M923.5 160 l2.6 2.6 l4.6 -5.2" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="943" y="156" width="112" height="7" rx="3.5" fill="#C9D8CC"/>

      <circle cx="927" cy="186" r="7" fill="#3FB584"/>
      <path d="M923.5 186 l2.6 2.6 l4.6 -5.2" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="943" y="182" width="92" height="7" rx="3.5" fill="#C9D8CC"/>

      <circle cx="927" cy="212" r="7" fill="#3FB584"/>
      <path d="M923.5 212 l2.6 2.6 l4.6 -5.2" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="943" y="208" width="104" height="7" rx="3.5" fill="#C9D8CC"/>
    </g>
    <rect x="920" y="234" width="56" height="7" rx="3.5" fill="#1F4D3A"/>

    <!-- Human approval stamp -->
    <circle cx="1092" cy="236" r="28" fill="#E0A33A" stroke="#1B211E" stroke-width="4"/>
    <path d="M1079 236 l9 9 l17 -19" fill="none" stroke="#1B211E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
