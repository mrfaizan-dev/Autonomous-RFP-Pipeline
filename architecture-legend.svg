<g font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#243B53">
<rect x="28" y="24" width="24" height="24" rx="7" fill="#EEF4F8" stroke="#486581"/><text x="65" y="43">Interface</text>
<rect x="300" y="24" width="24" height="24" rx="7" fill="#0E6B68" stroke="#63C9B7"/><text x="337" y="43">API</text>
<rect x="500" y="24" width="24" height="24" rx="7" fill="#25476A" stroke="#78A9D8"/><text x="537" y="43">Background jobs</text>
<rect x="820" y="24" width="24" height="24" rx="7" fill="#355C52" stroke="#89C8B6"/><text x="857" y="43">AI workflow</text>
