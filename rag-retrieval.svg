<title id="t">Portfolio RAG indexing and retrieval</title><desc id="d">Uploaded portfolio files are extracted, chunked, embedded and stored in ChromaDB. Retrieval combines vector similarity and BM25 through LlamaIndex query fusion before context reaches the proposal writer.</desc>
